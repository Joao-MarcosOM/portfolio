<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | João Marcos</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/portfolio/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/portfolio/assets/css/style.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .notfound h1 { font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.03em; }
    .notfound p { margin-top: 12px; color: var(--ink-2); }
    .notfound .actions { justify-content: center; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="eyebrow">404</p>
      <h1>Página não encontrada</h1>
      <p>Page not found.</p>
      <div class="actions">
        <a class="btn btn--primary" href="/portfolio/">Voltar ao portfólio</a>
        <a class="btn" href="/portfolio/?lang=en">Back to portfolio</a>
      </div>
    </div>
  </main>
</body>
</html>
